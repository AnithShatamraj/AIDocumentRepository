apiVersion: apps/v1
kind: Deployment
metadata:
  name: aidocs-api
  namespace: aidocs
spec:
  replicas: 2
  selector:
    matchLabels: { app: aidocs-api }
  template:
    metadata:
      labels: { app: aidocs-api }
    spec:
      containers:
        - name: api
          image: aidocs-backend:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: aidocs-config }
            - secretRef: { name: aidocs-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: aidocs-api
  namespace: aidocs
spec:
  selector: { app: aidocs-api }
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aidocs-api
  namespace: aidocs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aidocs-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
