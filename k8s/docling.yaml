# IBM Docling (docling-serve) as an independently scalable service.
# OCR/layout is memory- and CPU-hungry; scale this deployment separately from
# the Celery workers. For GPU: switch image to a -cu12x variant and add
# nvidia.com/gpu resources + a GPU node pool selector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aidocs-docling
  namespace: aidocs
spec:
  replicas: 1
  selector:
    matchLabels: { app: aidocs-docling }
  template:
    metadata:
      labels: { app: aidocs-docling }
    spec:
      containers:
        - name: docling
          image: ghcr.io/docling-project/docling-serve-cpu:latest
          ports:
            - containerPort: 5001
          env:
            - name: DOCLING_SERVE_ENABLE_UI
              value: "false"
          readinessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 5001 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: "1", memory: "3Gi" }
            limits: { cpu: "4", memory: "8Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: aidocs-docling
  namespace: aidocs
spec:
  selector: { app: aidocs-docling }
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aidocs-docling
  namespace: aidocs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aidocs-docling
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
